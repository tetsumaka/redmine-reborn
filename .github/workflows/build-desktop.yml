name: Build desktop

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: redmine-reborn-${{ matrix.os }}
          path: |
            release/redmine-reborn.exe
            release/redmine-reborn.AppImage
            release/redmine-reborn.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: redmine-reborn-*
          merge-multiple: true
          path: release
      - name: Publish latest desktop builds
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # An older, slower run must not replace builds of a newer master commit.
          master_sha="$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$master_sha" ]]; then
            echo "Skipping publication: master has moved to $master_sha."
            exit 0
          fi

          files=(release/redmine-reborn.exe release/redmine-reborn.AppImage release/redmine-reborn.zip)
          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing portable package: $file"
              exit 1
            fi
          done

          notes_file="$RUNNER_TEMP/desktop-release-notes.md"
          cat > "$notes_file" <<EOF
          Последняя портативная сборка ветки master. Файлы обновляются автоматически.

          Коммит: [$GITHUB_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)
          Сборка: [$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          Собрано (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')
          EOF

          tag_exists="$(gh api "repos/$GH_REPO/git/matching-refs/tags/latest" --jq '[.[] | select(.ref == "refs/tags/latest")] | length')"
          if [[ "$tag_exists" == "0" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA" > /dev/null
          else
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          fi

          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest "${files[@]}" --clobber

            # Remove obsolete packages, including previously published installers.
            old_assets="$(gh release view latest --json assets --jq '.assets[].name')"
            while IFS= read -r asset; do
              case "$asset" in
                *.exe|*.AppImage|*.zip|*.deb|*.dmg)
                  if [[ ! -f "release/$asset" ]]; then
                    gh release delete-asset latest "$asset" --yes
                  fi
                  ;;
              esac
            done <<< "$old_assets"

            gh release edit latest --title "Последняя сборка" --notes-file "$notes_file" --draft=false --prerelease=false --latest
          else
            gh release create latest "${files[@]}" --verify-tag --title "Последняя сборка" --notes-file "$notes_file" --latest
          fi
